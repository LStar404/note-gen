[project]
name = "note-gen"
version = "0.1.0"
description = "自动笔记软件：PDF -> 模块化、可双向定位、可增删改的 Markdown/LaTeX 笔记"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "filelock>=3.13",
  "httpx>=0.27",
  "pypdf>=4.2",
  "jinja2>=3.1",
  "json-repair>=0.25",
  "pylatexenc>=2.10",
]

[project.optional-dependencies]
marker = ["marker-pdf>=1.2"]
docling = ["docling>=2.0"]
formula = ["pix2text>=1.1"]
figures = ["pymupdf>=1.24"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.core", "src.ingest", "src.anchor", "src.generate", "src.link", "src.export", "src.db", "src.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
