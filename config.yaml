app:
  host: 127.0.0.1
  port: 8787
  cors_origins:
  - http://127.0.0.1:5173
parser:
  # auto = 按需分流：数字版 PDF（有文字层）走 pypdf 秒级路径，
  # 扫描书才用 marker/docling；显式指定 marker 会强制重型解析（百页数十分钟起）
  default: auto
  ocr_mode: auto
  python: null
chapters_override: []
generate:
  models:
    default: mimo/mimo-v2.6-flash
    outline: mimo/mimo-v2.6-flash
    fill: mimo/mimo-v2.6-flash
    agent: null
    link: null
  outline_max_in: 32000
  fill_max_in: 8000
  outline_max_out: 32000
  fill_max_out: 12000
  timeout: 600
  concurrency: 6
  # 推理深度：low/medium/high（推理型模型思考越深越慢；low 提速明显，
  # 复杂章节若质量不足可改 medium）
  reasoning_effort: low
  max_cost_per_chapter: 0.0
  temperature: 0.2
  output_language: zh
export:
  encoding: utf-8
embedding:
  provider: none
  model_dir: null
  dim: 1024
  threshold: 0.55
cache:
  dir: cache/gen
match:
  contain_ratio: 0.8
  cover_ratio: 0.5
  top_k: 8
history:
  keep_recent: 50
