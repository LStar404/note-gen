app:
  host: 127.0.0.1
  port: 8787
  cors_origins:
  - http://127.0.0.1:5173
parser:
  default: marker
  ocr_mode: auto
  python: null
chapters_override: []
generate:
  models:
    default: mimo/mimo-v2.6-flash
    outline: mimo/mimo-v2.6-flash
    fill: mimo/mimo-v2.6-flash
    agent: null
    link: null
  outline_max_in: 32000
  fill_max_in: 8000
  outline_max_out: 32000
  fill_max_out: 12000
  timeout: 600
  concurrency: 4
  max_cost_per_chapter: 0.0
  temperature: 0.2
  output_language: zh
export:
  encoding: utf-8
embedding:
  provider: none
  model_dir: null
  dim: 1024
  threshold: 0.55
cache:
  dir: cache/gen
match:
  contain_ratio: 0.8
  cover_ratio: 0.5
  top_k: 8
history:
  keep_recent: 50
