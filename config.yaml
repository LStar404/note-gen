app:
  host: 127.0.0.1
  port: 8787
  cors_origins:
  - http://127.0.0.1:5173
parser:
  # auto = 按需分流：数字版 PDF（有文字层）走 pypdf 秒级路径，
  # 扫描书才用 marker/docling；显式指定 marker 会强制重型解析（百页数十分钟起）
  default: auto
  ocr_mode: auto
  # 视觉补 OCR：本地 OCR 认不好的扫描页（公式/复杂排版乱码）交给视觉模型重识别，
  # 每页少量 token；auto=有视觉能力模型就启用，off=关闭
  ocr_vision: auto
  python: null
chapters_override: []
generate:
  models:
    # 笔记生成统一走 deepseek-flash（端点仅支持 deepseek-flash / deepseek-v4-pro，
    # 无 4.1 版；deepseek-v4-flash 是 deepseek-flash 的别名）：实测同题质量持平、
    # 时延更短、历史成功率 99.5%%。若要提纲用推理模型：outline: mimo/mimo-v2.6-flash；
    # 若要更高质量：fill: deepseek/deepseek-v4-pro
    default: deepseek/deepseek-flash
    outline: deepseek/deepseek-flash
    fill: deepseek/deepseek-flash
    agent: null
    link: null
  outline_max_in: 32000
  fill_max_in: 5000
  outline_max_out: 32000
  fill_max_out: 6000
  timeout: 600
  concurrency: 10
  # 小块合批：N 个就绪块一次填充调用（调用数降为 1/N，短块收益最大）；
  # 批内个别块校验失败自动回退逐块填充兜底。1 = 逐块（旧行为）
  fill_batch: 4
  # 提纲分批目标（预计输出 token/批）：批越小首批完成越快、填充越早开跑
  # （任务「启动」体感）；实测 MiMo 单批 7k-16k 输出要 3-8 分钟
  outline_batch_out: 6000
  # 整本生成时并行跑几章（写入仍按文档串行，不会互撞）
  chapter_concurrency: 3
  # 全局在途 LLM 请求上限（跨章节/跨任务共享）：防止并行分章把并发一次性
  # 打到「章数 × 章内并发」触发限流，反而被退避拖慢。
  # 实测（2026-10-13）：DeepSeek 按余额档位给并发上限，当前余额档 = 11，
  # 打满即 429；钉在 10 留一格。余额档位上调后可回调（并发类 429 已改为
  # 退避重试，不会再被误判成配额耗尽而熔断整章）
  max_concurrent_requests: 10
  # 推理深度：low/medium/high（推理型模型思考越深越慢；low 提速明显，
  # 复杂章节若质量不足可改 medium）
  reasoning_effort: low
  # 思考开关（deepseek-flash 支持；不认识的网关忽略）：disabled 实测同题 1.9s/230 tokens
  # vs 开思考 9.4s/2020 tokens，内容质量相当。质量不足时改 minimal / default
  thinking: disabled
  max_cost_per_chapter: 0.0
  temperature: 0.2
  output_language: zh
export:
  encoding: utf-8
embedding:
  provider: none
  model_dir: null
  dim: 1024
  threshold: 0.55
cache:
  dir: cache/gen
match:
  contain_ratio: 0.8
  cover_ratio: 0.5
  top_k: 8
history:
  keep_recent: 50
